<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Stickly</title>
  <desc id="desc">Move Telegram sticker packs to WhatsApp with Stickly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F2A44"/>
      <stop offset="55%" stop-color="#6750A4"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#EADDFF" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0E1016" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="1320" cy="60" r="210" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="260" cy="360" r="240" fill="#FFFFFF" opacity="0.06"/>
  <rect x="0" y="0" width="1600" height="400" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <g transform="translate(120 88)" filter="url(#shadow)">
    <rect width="224" height="224" rx="56" fill="url(#card)"/>
    <rect x="28" y="28" width="168" height="168" rx="42" fill="#6750A4"/>
    <path d="M78 118c0-24 18-42 42-42h30c24 0 42 18 42 42s-18 42-42 42h-10l-24 20v-20h-8c-24 0-30-18-30-42Z" fill="#FFFFFF"/>
    <circle cx="104" cy="116" r="8" fill="#6750A4"/>
    <circle cx="140" cy="116" r="8" fill="#6750A4"/>
    <path d="M104 136c10 8 22 8 32 0" stroke="#6750A4" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <g font-family="Google Sans, Product Sans, Roboto, sans-serif" fill="#FFFFFF">
    <text x="400" y="182" font-size="96" font-weight="800" letter-spacing="-3">Stickly</text>
    <text x="404" y="240" font-size="34" font-weight="500" opacity="0.94">Telegram sticker packs, new home on WhatsApp</text>
    <text x="404" y="286" font-size="24" font-weight="500" opacity="0.78">Material 3 Expressive  ·  512×512 WebP  ·  static + animated  ·  on-device</text>
  </g>

  <g transform="translate(1160 118)" filter="url(#shadow)">
    <g transform="rotate(-10 90 90)">
      <rect x="12" y="18" width="156" height="156" rx="36" fill="#FFFBFE"/>
      <text x="52" y="126" font-family="Roboto, sans-serif" font-size="76">🍩</text>
    </g>
    <g transform="rotate(8 150 120)">
      <rect x="96" y="60" width="156" height="156" rx="36" fill="#EADDFF"/>
      <text x="136" y="168" font-family="Roboto, sans-serif" font-size="76">🐱</text>
    </g>
  </g>
</svg>
